<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bannerBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05070A" />
    </radialGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1280" height="640" fill="url(#bannerBg)" />

  <!-- Subtle Precision Matrix Grid -->
  <g opacity="0.05" stroke="#00D2FF" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />

    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="280" cy="320" r="180" fill="#00D2FF" opacity="0.08" />

  <!-- Left: Geometric Logo Mark -->
  <g transform="translate(40, 70)">
    <!-- Base Layer Connections -->
    <path d="M140 350 L240 400 L340 350 L240 300 Z" fill="none" stroke="#1E293B" stroke-width="2" />
    
    <!-- Flow Lines -->
    <path d="M170 335 L170 230 L240 190" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="4 4" />
    <path d="M310 335 L310 230 L240 190" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="4 4" />
    <path d="M240 380 L240 230" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.8" />

    <!-- Mid Tier -->
    <polygon points="240,190 320,230 240,270 160,230" fill="#0F172A" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.9" />

    <!-- Apex Cube -->
    <g filter="url(#cyanGlow)">
      <polygon points="240,120 290,145 240,170 190,145" fill="#00F5D4" opacity="0.9" />
      <polygon points="190,145 240,170 240,210 190,185" fill="#00B4D8" opacity="0.75" />
      <polygon points="240,170 290,145 290,185 240,210" fill="#0077B6" opacity="0.9" />
    </g>

    <!-- Nodes -->
    <circle cx="240" cy="120" r="6" fill="#FFFFFF" filter="url(#cyanGlow)" />
    <circle cx="160" cy="230" r="5" fill="#00F5D4" filter="url(#cyanGlow)" />
    <circle cx="320" cy="230" r="5" fill="#00D2FF" filter="url(#cyanGlow)" />
    <circle cx="240" cy="400" r="5" fill="#00F5D4" filter="url(#cyanGlow)" />
  </g>

  <!-- Right: Typography & Brand Hierarchy -->
  <g transform="translate(500, 220)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#0F172A" stroke="#00D2FF" stroke-width="1.5" opacity="0.9" />
    <circle cx="16" cy="16" r="4" fill="#00F5D4" filter="url(#cyanGlow)" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5">OPEN-SOURCE RESEARCH</text>

    <!-- Primary Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">HOW SYSTEMS SCALE</text>

    <!-- Subtitle / Positioning -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
      First-Principles Architecture Teardowns &amp; Hardware Rooflines
    </text>

    <!-- Pillars / System Tags -->
    <g transform="translate(0, 180)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#64748B">
      <text x="0" y="0">
        <tspan fill="#00F5D4">•</tspan> DeepSeek MLA <tspan fill="#334155">|</tspan>
        <tspan fill="#00D2FF">•</tspan> Hotstar 59M Concurrency <tspan fill="#334155">|</tspan>
        <tspan fill="#38BDF8">•</tspan> UPI Lock-Free Sagas <tspan fill="#334155">|</tspan>
        <tspan fill="#60A5FA">•</tspan> Cursor Fast Apply
      </text>
    </g>
  </g>
</svg>

