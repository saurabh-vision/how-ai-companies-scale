<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#080B10" />
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for Pipelines -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="pillarGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pillarGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Trace -->
  <g opacity="0.08" stroke="#00D2FF" stroke-width="1">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Ambient Underglow -->
  <circle cx="256" cy="256" r="140" fill="#00D2FF" opacity="0.06" filter="url(#softGlow)" />

  <!-- Center Geometric Scaled Monolith & Distributed Mesh -->
  <g transform="translate(0, 8)">
    <!-- Base Layer Connections (Substrate) -->
    <path d="M140 350 L256 410 L372 350 L256 290 Z" fill="none" stroke="#1E293B" stroke-width="2.5" />
    <path d="M140 350 L140 330 L256 390 L372 330 L372 350" fill="none" stroke="#1E293B" stroke-width="2" />

    <!-- Upward Concurrency Pipeline Traces (Data Flow) -->
    <path d="M176 330 L176 220 L256 176" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="4 4" />
    <path d="M336 330 L336 220 L256 176" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="4 4" />
    <path d="M256 390 L256 220" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3.5" opacity="0.8" />

    <!-- Mid Tier Layer (Decoupled Sagas / Attention Layer) -->
    <polygon points="256,180 348,226 256,272 164,226" fill="#0F172A" stroke="url(#cyanBlueGrad)" stroke-width="3.5" opacity="0.9" />

    <!-- Isometric Scaling Tier 3 (The Apex / Frontier Model Node) -->
    <g filter="url(#cyanGlow)">
      <!-- Top Cube Apex -->
      <polygon points="256,104 316,134 256,164 196,134" fill="#00F5D4" opacity="0.85" />
      <polygon points="196,134 256,164 256,214 196,184" fill="#00B4D8" opacity="0.7" />
      <polygon points="256,164 316,134 316,184 256,214" fill="#0077B6" opacity="0.9" />
    </g>

    <!-- High-Throughput Distributed System Nodes -->
    <!-- Apex Node -->
    <circle cx="256" cy="104" r="7" fill="#FFFFFF" filter="url(#cyanGlow)" />

    <!-- Tier-2 Nodes -->
    <circle cx="164" cy="226" r="6" fill="#00F5D4" filter="url(#cyanGlow)" />
    <circle cx="348" cy="226" r="6" fill="#00D2FF" filter="url(#cyanGlow)" />
    <circle cx="256" cy="272" r="6" fill="#0066FF" filter="url(#cyanGlow)" />

    <!-- Substrate Nodes -->
    <circle cx="140" cy="350" r="5" fill="#38BDF8" opacity="0.8" />
    <circle cx="372" cy="350" r="5" fill="#38BDF8" opacity="0.8" />
    <circle cx="256" cy="410" r="6" fill="#00F5D4" filter="url(#cyanGlow)" />

    <!-- Data Stream Light Pulses -->
    <line x1="256" y1="130" x2="256" y2="150" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />
    <circle cx="256" cy="176" r="4" fill="#FFFFFF" />
  </g>
</svg>

